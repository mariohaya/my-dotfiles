# ~/.config/hypr/hypridle.conf

general {
    # Start hyprlock whenever the session is locked
    lock_cmd = pidof hyprlock || hyprlock

    # Ensure the session is locked before any suspend
    before_sleep_cmd = loginctl lock-session

    # Make sure displays come back after resume
    after_sleep_cmd = hyprctl dispatch dpms on
}


# Dim display at 3 minutes
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 25%
    on-resume = brightnessctl -r
}


# Lock session at 7 minutes
listener {
    timeout = 420
    on-timeout = loginctl lock-session
}


# Turn displays off at 8 minutes
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}


# Suspend system at 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
