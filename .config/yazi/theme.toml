# ~/.config/yazi/theme.toml
# Migrated from ~/.config/lf/colors (uploaded as colors(1)).
# Preserves the original filename-extension and special-directory color rules.
# The 256-color SGR palette has been converted to RGB hex for Yazi.
# The UI outside the file list continues using Yazi's defaults.
# Yazi 26.9.1 supports [filetype].rules with url/mime/is and fg/bg/bold/etc.

[filetype]
rules = [

  # Special directory colors from lf (ordered before the generic directory rule)
  { url = "**/Main Vault/", fg = "#af00ff" },  # /home/mario/Main Vault
  { url = "**/MyDrive/", fg = "#bcbcbc" },  # /home/mario/MyDrive
  { url = "/run/", fg = "#ff0000" },  # /run/
  { url = "/home/", fg = "#ffffff" },  # /home/
  { url = "/usr/", fg = "#00ff5f" },  # /usr/
  { url = "**/.config/", fg = "#ff0000" },  # ~/.config/

  # Special file types (lf has no exact equivalent for setuid, setgid, or world-writable flags)
  { url = "*", is = "link", bold = true, fg = "cyan" },  # symbolic link
  { url = "*", is = "orphan", fg = "red", bold = true },  # broken symbolic link
  { url = "*", is = "sticky", bold = true, fg = "blue" },  # sticky-bit files/directories
  { url = "*", is = "fifo", fg = "yellow" },  # FIFO
  { url = "*", is = "sock", bold = true, fg = "magenta" },  # socket
  { url = "*", is = "block", fg = "yellow", bold = true },  # block device
  { url = "*", is = "char", fg = "yellow", bold = true },  # character device
  { url = "*", is = "exec", bold = true, fg = "green" },  # executable

  # archives or compressed
  { url = "*.tar", bold = true, fg = "red" },
  { url = "*.tgz", bold = true, fg = "red" },
  { url = "*.arc", bold = true, fg = "red" },
